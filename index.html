<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>짐싸기</title>
<meta name="theme-color" content="#6b5ce7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="짐싸기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f2;--surface:#fff;--border:#e5e3dc;--border-soft:#eeece6;
  --text-primary:#1a1917;--text-secondary:#6b6860;--text-muted:#a8a59e;
  --accent:#6b5ce7;--accent-light:#ede9ff;--accent-mid:#c4b8f8;
  --warn-bg:#fff8ed;--warn-text:#9a6800;
  --info-bg:#edf4ff;--info-text:#1a5fb4;
  --ok-bg:#edfce8;--ok-text:#2a7a1e;
  --local-bg:#fff0f6;--local-text:#9b3070;
  --danger:#e53e3e;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.screen{display:none;min-height:100vh}
.screen.on{display:block}

/* ── HEADER ── */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem .7rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.app-title{font-size:18px;font-weight:500;letter-spacing:-.3px}
.icon-btn{font-family:inherit;background:none;border:none;font-size:20px;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1}
.icon-btn:active{background:var(--accent-light)}

/* ── HOME ── */
.trip-list{padding:.9rem;display:flex;flex-direction:column;gap:10px}
.empty-state{text-align:center;padding:3.5rem 1rem;color:var(--text-muted)}
.empty-state p{font-size:15px;margin-bottom:6px}
.empty-state small{font-size:12px}
.trip-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;cursor:pointer}
.trip-card:active{box-shadow:0 0 0 2px var(--accent-mid)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.tc-name{font-size:16px;font-weight:500}
.tc-dest{font-size:12px;color:var(--text-muted);margin-top:2px}
.tc-badge{font-size:11px;background:var(--accent-light);color:var(--accent);padding:3px 9px;border-radius:10px;font-weight:500;white-space:nowrap;flex-shrink:0}
.tc-dates{font-size:12px;color:var(--text-secondary);margin-bottom:9px}
.tc-bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.tc-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.tc-pct{font-size:11px;color:var(--text-muted);margin-top:4px;text-align:right}

/* ── PROGRESS ── */
.prog-wrap{background:var(--surface);padding:.65rem 1rem;border-bottom:1px solid var(--border)}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:5px}
#prog-count{font-weight:500;color:var(--text-primary)}
.prog-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .35s;width:0%}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 .5rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:10px 13px;border:none;background:none;color:var(--text-muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

/* ── CHECKLIST ── */
.cl-content{padding:.75rem 1rem 5.5rem}
.notice{font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:12px;line-height:1.7}
.notice-warn{background:var(--warn-bg);color:var(--warn-text);border-left:3px solid #f0b429}
.notice-info{background:var(--info-bg);color:var(--info-text);border-left:3px solid #4a90d9}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px 6px;margin:0 0 8px 0;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;display:inline-block;width:100%}
.sec-title{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.06em;padding:0;border:none;margin:0;text-transform:uppercase}
.sec-title-row{padding-bottom:6px;border-bottom:1px solid var(--border-soft);margin-bottom:3px}
.subsec-label{font-size:11px;color:var(--text-muted);padding:7px 0 2px}

/* ── 벽돌(masonry) 레이아웃 — 카테고리 카드를 컬럼 단위로 깔기 ── */
#cat-list{column-count:2;column-gap:8px;column-fill:balance}
@media (min-width:560px){#cat-list{column-count:3}}
@media (min-width:840px){#cat-list{column-count:4}}
.edit-mode #cat-list{column-count:1}
#cat-list .itm-row{padding:6px 0;gap:5px}
#cat-list .itm-label{font-size:13px;line-height:1.4}
#cat-list .itm-qty{font-size:10px;padding:1px 5px}

/* ── ITEM ── */
.itm{border-bottom:1px solid var(--border-soft)}
.itm:last-child{border-bottom:none}
.itm-row{display:flex;align-items:center;gap:9px;padding:9px 0}
.itm-cb{display:none}
.itm-main{flex:1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.itm-label{font-size:14px;flex:1;min-width:0}
.itm.done .itm-label{text-decoration:line-through;color:var(--text-muted)}
.itm.is-local .itm-label{color:var(--text-muted)}
.itm-qty{font-size:11px;background:var(--accent-light);color:var(--accent);padding:1px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.itm.is-local .itm-qty{background:var(--local-bg);color:var(--local-text)}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag-warn{background:var(--warn-bg);color:var(--warn-text)}
.tag-info{background:var(--info-bg);color:var(--info-text)}
.tag-ok{background:var(--ok-bg);color:var(--ok-text)}
.tag-local{background:var(--local-bg);color:var(--local-text)}
.btn-local{background:none;border:1px solid var(--border);border-radius:6px;font-size:13px;padding:2px 5px;cursor:pointer;color:var(--text-muted);line-height:1;flex-shrink:0}
.btn-local.on{border-color:var(--local-text);color:var(--local-text);background:var(--local-bg)}
.btn-decant{background:none;border:1px solid var(--border);border-radius:6px;font-size:10px;padding:2px 7px;cursor:pointer;color:var(--text-muted);flex-shrink:0;letter-spacing:-.2px}
.btn-decant.has-val{border-color:var(--accent-mid);color:var(--accent);background:var(--accent-light)}

/* ── DECANT PANEL ── */
.decant-panel{display:none;background:rgba(107,92,231,.05);border:1px solid var(--accent-mid);border-radius:10px;padding:10px 12px;margin:0 0 8px;gap:10px;flex-wrap:wrap;align-items:center}
.decant-panel.open{display:flex}
.dp-group{display:flex;flex-direction:column;gap:3px}
.dp-group label{font-size:10px;color:var(--text-muted)}
.dp-group input,.dp-group select{font-family:'Noto Sans KR',sans-serif;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text-primary);width:90px}
.dp-result{font-size:12px;background:var(--accent-light);color:var(--accent);border-radius:6px;padding:5px 10px;font-weight:500;align-self:flex-end}

/* ── LOCAL TAB ITEMS ── */
.local-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.local-row:last-child{border-bottom:none}
.local-row .local-label{flex:1;font-size:14px}
.revert-btn{font-family:'Noto Sans KR',sans-serif;font-size:11px;background:none;border:1px solid var(--local-text);color:var(--local-text);border-radius:6px;padding:3px 9px;cursor:pointer}

/* ── FAB ── */
.fab{position:fixed;bottom:1.4rem;right:1.3rem;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 3px 12px rgba(107,92,231,.4);display:flex;align-items:center;justify-content:center;z-index:20;line-height:1}
.fab:active{transform:scale(.95)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:flex;align-items:flex-end}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,1rem)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.2rem .8rem;font-size:16px;font-weight:500;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-close{font-family:inherit;background:none;border:none;font-size:22px;color:var(--text-muted);cursor:pointer;padding:0 4px;line-height:1}
.modal-body{padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:11px}
.modal-body label{font-size:12px;color:var(--text-secondary);margin-bottom:-5px}
.modal-body input[type=text],.modal-body input[type=date],.modal-body select{font-family:'Noto Sans KR',sans-serif;font-size:15px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--text-primary);width:100%}
.modal-body input:focus,.modal-body select:focus{outline:none;border-color:var(--accent-mid)}
.date-row{display:flex;gap:9px}
.date-row>div{flex:1;display:flex;flex-direction:column;gap:4px}
.nights-chip{background:var(--accent-light);color:var(--accent);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;text-align:center}
.modal-ft{padding:0 1.2rem 1.1rem;display:flex;gap:8px}
.btn-primary{flex:1;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:500;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;cursor:pointer}
.btn-primary:active{opacity:.85}
.btn-danger{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:none;color:var(--danger);border:1px solid var(--danger);border-radius:12px;padding:13px 16px;cursor:pointer}
.cb-row{display:flex;align-items:center;gap:9px}
.cb-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.cb-row label{font-size:14px;margin-bottom:0!important}

/* ── SYNC ── */
.sync-dot{position:fixed;top:0;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:11px;padding:3px 13px;border-radius:0 0 9px 9px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.sync-dot.show{opacity:1}

/* ── HEADER INFO ── */
.hd-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.hd-name{font-size:15px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:180px}
.hd-nights{font-size:11px;color:var(--text-muted)}

/* ── EDIT MODE ── */
.icon-btn.on{background:var(--accent-light);color:var(--accent)}
.btn-save-edit{display:none;font-family:inherit;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;padding:6px 12px;font-weight:500;cursor:pointer}
.edit-mode .btn-save-edit{display:inline-block}
.edit-mode #btn-edit-mode,.edit-mode #btn-categorize{display:none}
.edit-mode .itm-cb{display:none}
.edit-mode .btn-local{display:none}
.edit-mode .btn-decant{display:none}
.edit-mode .decant-panel{display:none!important}
.edit-mode .itm-qty,.edit-mode .tag{display:none}
.edit-mode .itm{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:0 0 6px;padding:0 11px}
.edit-mode .itm-row{padding:11px 0;gap:8px}
.edit-mode .itm.is-local .itm-label{color:var(--text-primary)}
.edit-mode .itm.done .itm-label{text-decoration:none;color:var(--text-primary)}
.edit-mode .cat-items{min-height:14px;padding:2px 0 4px}
.edit-mode .sec{background:var(--bg);border-color:var(--border-soft)}
.edit-mode .sec-title-row{padding-bottom:8px}
.edit-mode .itm-period{padding:2px 7px;gap:3px;background:var(--ok-bg);color:var(--ok-text)}
.edit-mode .itm-period.empty{background:var(--bg);color:var(--text-muted);border:1px dashed var(--border);opacity:1}
.itm-period{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:500;cursor:pointer;flex-shrink:0;line-height:1.5;background:var(--ok-bg);color:var(--ok-text)}
.itm-period.empty{background:transparent;color:var(--text-muted);border:1px dashed var(--border);font-weight:400;opacity:.6}
.itm-period.empty:active{opacity:1;background:var(--bg)}

.itm-decant{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:500;cursor:pointer;flex-shrink:0;line-height:1.5;background:var(--info-bg);color:var(--info-text)}
.itm-decant.empty{background:transparent;color:var(--text-muted);border:1px dashed var(--border);font-weight:400;opacity:.6}
.itm-decant.empty:active{opacity:1;background:var(--bg)}

/* ── 정기 사용량 인라인 픽커 ── */
.period-picker{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;gap:4px;flex-wrap:wrap;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.14);max-width:240px}
.period-picker button{font-family:inherit;font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:5px 9px;cursor:pointer;line-height:1.3;color:var(--text-primary)}
.period-picker button:active{background:var(--accent-light);border-color:var(--accent-mid);color:var(--accent)}
.period-picker button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.period-picker button.off{color:var(--danger);border-color:var(--danger)}
.period-picker button.more{color:var(--accent);border-color:var(--accent-mid);background:var(--accent-light)}

/* ── CATEGORIZE-ONLY MODE (가장 단순한 분류 전용 뷰) ── */
.categorize-mode .btn-itm-edit,
.categorize-mode .btn-itm-del,
.categorize-mode .itm-period,
.categorize-mode .cat-actions,
.categorize-mode .cat-handle,
.categorize-mode .add-cat-btn,
.categorize-mode .edit-hint,
.categorize-mode .notice{display:none!important}
.categorize-mode .cl-content{padding:.5rem .55rem 5.5rem}

/* ── SPLIT LAYOUT: 좌측 주머니 / 우측 바닥 ── */
.layout-split{display:flex;gap:8px;height:calc(100vh - 220px);min-height:380px;overflow:hidden;margin-top:2px}
.col-pouches,.col-floor{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:6px}
.col-pouches{gap:6px}
.col-title{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:.06em;padding:2px 0 6px;position:sticky;top:0;background:var(--bg);z-index:1;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:6px}
.btn-floor-toggle{font-family:inherit;background:none;border:1px solid var(--border);color:var(--text-muted);font-size:10px;border-radius:6px;padding:3px 8px;cursor:pointer;line-height:1.4;flex-shrink:0;text-transform:none;letter-spacing:0}
.btn-floor-toggle:active{background:var(--accent-light);color:var(--accent);border-color:var(--accent-mid)}
.layout-split.floor-collapsed .col-floor{display:none}
.layout-split.floor-collapsed .col-pouches{flex:1}
.cat-toolbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px;flex-wrap:wrap}
.pouch{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0}
.pouch-header{padding:9px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500;user-select:none;-webkit-tap-highlight-color:transparent}
.pouch-header:active{background:var(--accent-light)}
.pouch-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pouch-count{font-size:10px;color:var(--text-muted);background:var(--bg);padding:2px 7px;border-radius:9px;font-weight:500;min-width:22px;text-align:center}
.pouch-caret{font-size:10px;color:var(--text-muted);transition:transform .2s}
.pouch.expanded .pouch-caret{transform:rotate(180deg)}
.pouch-body{padding:5px 6px 6px;background:var(--bg);min-height:30px;border-top:1px dashed var(--border-soft)}
.pouch.collapsed .pouch-body{max-height:30px;overflow:hidden;position:relative}
.pouch.collapsed .pouch-body::before{content:'⌄ 떨구기';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted);pointer-events:none}
.pouch.expanded .pouch-body{max-height:none}
.col-floor .floor-wrap{flex:1;display:flex;flex-direction:column}
.floor{background:var(--surface);border:2px dashed var(--border);border-radius:10px;padding:6px;flex:1;min-height:140px;overflow-y:auto}
.floor:empty::before{content:'바닥에 끌어두면 분류 안 된 상태로 둘 수 있어요';display:block;color:var(--text-muted);font-size:11px;text-align:center;padding:1.5rem .5rem;line-height:1.5}
.add-pouch-btn{font-family:inherit;width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:10px;padding:9px;font-size:12px;cursor:pointer;flex-shrink:0;margin-top:6px}
.add-pouch-btn:active{background:var(--accent-light);color:var(--accent);border-color:var(--accent-mid)}

.itm.tiny{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 4px 6px 9px;display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.3;flex-shrink:0;margin-bottom:3px;cursor:grab;user-select:none;-webkit-user-select:none}
.itm.tiny:active{cursor:grabbing;background:var(--accent-light);border-color:var(--accent-mid)}
.itm.tiny:last-child{margin-bottom:0}
.itm.tiny .itm-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;pointer-events:none}
.itm.tiny .btn-rename{font-family:inherit;background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:3px 6px;flex-shrink:0;border-radius:5px;line-height:1}
.itm.tiny .btn-rename:active{background:var(--accent-light);color:var(--accent)}
.floor .itm.tiny{background:var(--bg)}
.drag-handle{display:none;color:var(--text-muted);font-size:18px;cursor:grab;padding:0 6px;line-height:1;flex-shrink:0;touch-action:none;user-select:none}
.edit-mode .drag-handle{display:inline-block}
.btn-itm-edit,.btn-itm-del{display:none;font-family:inherit;background:none;border:1px solid var(--border);border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer;color:var(--text-muted);flex-shrink:0;line-height:1.4}
.btn-itm-del{color:var(--danger);border-color:var(--danger)}
.edit-mode .btn-itm-edit,.edit-mode .btn-itm-del{display:inline-block}
.cat-actions{display:none;gap:4px;align-items:center}
.edit-mode .cat-actions{display:flex}
.btn-cat{font-family:inherit;background:none;border:none;font-size:13px;padding:3px 6px;cursor:pointer;color:var(--text-muted);line-height:1}
.btn-cat.danger{color:var(--danger)}
.sec-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:3px}
.sec-title-row .sec-title{padding:0;border:none;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-handle{display:none;color:var(--text-muted);font-size:16px;cursor:grab;padding:0 4px 0 0;flex-shrink:0;touch-action:none;user-select:none}
.edit-mode .cat-handle{display:inline-block}
.add-cat-btn{font-family:inherit;width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:10px;padding:11px;font-size:13px;cursor:pointer;margin-top:8px;display:none}
.edit-mode .add-cat-btn{display:block}
.add-cat-btn:active{background:var(--accent-light);color:var(--accent);border-color:var(--accent-mid)}
.sortable-ghost{opacity:.4}
.sortable-chosen{background:var(--accent-light)}
.itm.dragging{background:var(--accent-light);border-radius:8px}
.edit-mode .notice{display:none}

// ── HELPERS ────────────────────────────
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function calcNights(s, e) {
  if (!s || !e) return 0;
  return Math.max(0, Math.round((new Date(e) - new Date(s)) / 86400000));
}

function calcQty(formula, n) {
  if (!formula) return 1;
  try { return Math.max(1, Math.round(eval(formula))); } catch { return 1; }
}

// 정기 사용량 (every N일에 count개) 기반 수량 계산
function calcQtyPeriodic(perDayEvery, perDayCount, nights) {
  if (!perDayEvery || !perDayCount) return null;
  if (nights <= 0) return perDayCount;
  // 여행 일수(=nights+1)동안 every일에 count개 = ceil((nights+1)/every)*count
  const days = nights + 1;
  return Math.max(1, Math.ceil(days / perDayEvery) * perDayCount);
}

// 펌프 기반 필요 ml 계산
function calcPumpMl(pumpsPerDay, mlPerPump, nights) {
  if (!pumpsPerDay || !mlPerPump) return null;
  const days = Math.max(1, nights + 1);
  return +(pumpsPerDay * mlPerPump * days).toFixed(2);
}

function calcDecant(ml, cml) {
  if (!ml || !cml) return null;
  return Math.ceil(ml / cml);
}

// 항목의 표시 수량 결정 (perDay 우선, 없으면 qtyF)
function itemQty(item, nights) {
  if (item.perDayEvery && item.perDayCount) {
    return calcQtyPeriodic(item.perDayEvery, item.perDayCount, nights);
  }
  if (item.qtyF && nights > 0) return calcQty(item.qtyF, nights);
  return null;
}

function nightsLabel(n) {
  return n === 0 ? '당일치기' : `${n}박 ${n+1}일`;

    // ── recommend ──
    {l:'얇은 겉옷 (카디건·바람막이)',c:'추천', s:'recommend'},
    {l:'상비약 (진통제·소화제·밴드)',c:'추천', s:'recommend'},
    {l:'지퍼백 (액체류 소분 포장)', c:'추천', s:'recommend'},
  ];

  const out = {};
  T.forEach((t, i) => {
    const id = 'i' + Date.now() + '_' + i;
    const sec = t.s || 'pack';
    const qty = (t.f && nights > 0) ? calcQty(t.f, nights) : null;
    out[id] = {
      id, label:t.l, cat:t.c, sub:t.sub||null,
      section: sec, checked:false, localBuy:false,
      qty, qtyF:t.f||null,
      perDayEvery:null, perDayCount:null,
      hasMl:!!(t.ml), ml:null, cml:50,
      pumpsPerDay:null, mlPerPump:null,
      ti:t.ti||null, tt:t.tt||null,
      ord:i
    };
  });
  return out;
}

// 카테고리 순서 가져오기 (meta.catOrder 우선, 없으면 첫 등장 순)
// 편집 모드에서는 빈 카테고리도 표시하도록 saved를 모두 포함
function getCatOrder(items, section, meta) {
  const present = [];
  items.filter(i => i.section === section).forEach(i => {
    const c = i.cat || '기타';
    if (!present.includes(c)) present.push(c);
  });
  const saved = meta?.catOrder?.[section] || [];
  const result = editMode
    ? [...saved]
    : saved.filter(c => present.includes(c));
  present.forEach(c => { if (!result.includes(c)) result.push(c); });
  return result;
}

function destroySortables() {
  _sortables.forEach(s => { try { s.destroy(); } catch(e){} });
  _sortables = [];
}

// ── HOME RENDER ────────────────────────
function renderHome() {
  const list  = document.getElementById('trip-list');
  const empty = document.getElementById('empty-state');
  const ids   = Object.keys(db_data);

  if (!ids.length) { list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';

  ids.sort((a,b) => (db_data[b].meta?.ca||0) - (db_data[a].meta?.ca||0));

  list.innerHTML = ids.map(id => {
    const {meta, items} = db_data[id] || {};
    if (!meta) return '';
    const all   = Object.values(items||{});
    const pack  = all.filter(i => i.section==='pack' && !i.localBuy);
    const done  = pack.filter(i => i.checked).length;
    const total = pack.length;
    const pct   = total ? Math.round(done/total*100) : 0;
    const nights = meta.nights || 0;
    const dates  = meta.start && meta.end
      ? `${meta.start.slice(5).replace('-','/')} ~ ${meta.end.slice(5).replace('-','/')}`
      : '날짜 미정';
    return `<div class="trip-card" onclick="APP.openTrip('${id}')">
      <div class="tc-top">
        <div>
          <div class="tc-name">${esc(meta.name||'이름 없음')}</div>
          <div class="tc-dest">${esc(meta.dest||'')}</div>
        </div>
        <div class="tc-badge">${nightsLabel(nights)}</div>
      </div>
      <div class="tc-dates">${dates}</div>
      <div class="tc-bar-bg"><div class="tc-bar-fill" style="width:${pct}%"></div></div>
      <div class="tc-pct">${done} / ${total} 준비 완료</div>
    </div>`;
  }).join('');
}

// ── CHECKLIST RENDER ───────────────────
function renderChecklist() {
  if (!tripId) return;
  const data  = db_data[tripId];
  if (!data) return;
  const items = Object.values(data.items||{}).sort((a,b)=>(a.ord||0)-(b.ord||0));

  destroySortables();
  updateProgress(items);

  const screen = document.getElementById('s-trip');
  screen.classList.toggle('edit-mode',       !!editMode);
  screen.classList.toggle('categorize-mode', editMode === 'categorize');

  const el = document.getElementById('cl-content');
  if (editMode === 'categorize') {
    el.innerHTML = renderCategorize(items, curTab, data.meta);
  } else if (curTab === 'pack')      el.innerHTML = renderPack(items, data.meta);
  else if (curTab === 'todo') el.innerHTML = renderSimple(items, data.meta, 'todo');
  else if (curTab === 'local')el.innerHTML = renderLocal(items, data.meta);
  else                        el.innerHTML = renderSimple(items, data.meta, 'recommend');

  if (editMode) initSortables();

  // 분류 모드: 펼쳐둔 주머니 상태 복원
  if (editMode === 'categorize') {
    _expandedPouches.forEach(key => {
      const [sec, cat] = key.split(':');
      if (sec !== curTab) return;
      const pouch = document.querySelector(`.pouch[data-cat="${CSS.escape(cat)}"]`);
      if (pouch) {
        pouch.classList.remove('collapsed');
        pouch.classList.add('expanded');
      }
    });
  }

  // 소분 패널 펼침 상태 복원 (저장 시 자동 닫힘 방지)
  if (!editMode) {
    _openDecants.forEach(id => {
      document.getElementById('dp-'+id)?.classList.add('open');
    });
  }
}

function updateProgress(items) {
  const pack  = (items||[]).filter(i => i.section==='pack' && !i.localBuy);
  const done  = pack.filter(i => i.checked).length;
  const total = pack.length;
  const pct   = total ? Math.round(done/total*100) : 0;
  document.getElementById('prog-count').textContent = `${done} / ${total}`;
  document.getElementById('prog-bar').style.width   = pct + '%';
  // Update home card too
  renderHome();
}

function renderPack(items, meta) {
  const nights = meta?.nights || 0;
  const pack   = items.filter(i => i.section==='pack');
  const cats   = getCatOrder(items, 'pack', meta);

  let html = `<div class="notice notice-warn">노트북 기내 반입 시 캐리어 위탁 수하물 자동 확정 · 액체류 100ml 초과 제품은 위탁 분류</div>`;
  html += renderEditHint();
  html += `<div id="cat-list" data-section="pack">`;

  cats.forEach(cat => {
    html += renderCategory(pack, cat, nights, 'pack');
  });

  html += `</div>`;
  html += `<button class="add-cat-btn" data-section="pack">＋ 새 카테고리</button>`;
  return html;
}

function renderCategory(sectionItems, cat, nights, section) {
  const ci = sectionItems.filter(i => (i.cat||'기타') === cat).sort((a,b)=>(a.ord||0)-(b.ord||0));
  const subs = [...new Set(ci.map(i => i.sub||''))];
  let html = `<div class="sec" data-cat="${esc(cat)}">
    <div class="sec-title-row">
      <span class="cat-handle" title="카테고리 이동">⋮⋮</span>
      <span class="sec-title">${esc(cat)}</span>
      <span class="cat-actions">
        <button class="btn-cat" onclick="APP.renameCategory('${esc(section)}','${esc(cat).replace(/'/g,"\\'")}')">이름</button>
        <button class="btn-cat danger" onclick="APP.deleteCategory('${esc(section)}','${esc(cat).replace(/'/g,"\\'")}')">삭제</button>
      </span>
    </div>
    <div class="cat-items" data-cat="${esc(cat)}" data-section="${esc(section)}">`;
  subs.forEach(sub => {
    if (sub) html += `<div class="subsec-label">— ${esc(sub)}</div>`;
    ci.filter(i=>(i.sub||'')===sub).forEach(item => {
      html += section === 'pack'
        ? renderPackItem(item, nights)
        : renderSimpleItem(item);
    });
  });
  html += `</div></div>`;
  return html;
}

function renderEditHint() {
  const text = '⋮⋮ 핸들로 항목·카테고리를 끌어 옮길 수 있어요. 이름·삭제는 카테고리 옆 버튼으로.';
  return `<div class="edit-hint">${text}</div>`;
}

// 분류 모드의 floor 식별용 cat name
const FLOOR_CAT = '미분류';

function renderCategorize(items, section, meta) {
  const sectionItems = items.filter(i => i.section === section);
  const floorItems   = sectionItems.filter(i => (i.cat||'') === FLOOR_CAT)
                                   .sort((a,b) => (a.ord||0) - (b.ord||0));
  const cats = getCatOrder(items, section, meta).filter(c => c !== FLOOR_CAT);
  const collapsed = _floorCollapsed;

  const allExpanded = cats.length > 0 && cats.every(c => _expandedPouches.has(section + ':' + c));
  let html = `<div class="cat-toolbar">
    <button class="btn-floor-toggle" onclick="APP.resetToFloor()">↺ 전부 바닥으로</button>
    <button class="btn-floor-toggle" onclick="APP.toggleAllPouches()">${allExpanded ? '📁 주머니 접기' : '📂 주머니 펴기'}</button>
    ${collapsed
      ? `<button class="btn-floor-toggle" onclick="APP.toggleFloor()">🪣 바닥 (${floorItems.length}) 펴기</button>`
      : `<button class="btn-floor-toggle" onclick="APP.toggleFloor()">🪣 바닥 접기</button>`}
  </div>
  <div class="layout-split${collapsed?' floor-collapsed':''}">
    <div class="col-pouches">
      <div class="col-title">
        <span>📦 주머니${collapsed?'':' (탭→열림)'}</span>
      </div>`;

  cats.forEach(cat => {
    const ci = sectionItems.filter(i => (i.cat||'기타') === cat)
                           .sort((a,b) => (a.ord||0) - (b.ord||0));
    html += `<div class="pouch collapsed" data-cat="${esc(cat)}">
      <div class="pouch-header" onclick="APP.togglePouch(this)">
        <span class="pouch-name">${esc(cat)}</span>
        <span class="pouch-count">${ci.length}</span>
        <span class="pouch-caret">▾</span>
      </div>
      <div class="pouch-body cat-items" data-cat="${esc(cat)}" data-section="${esc(section)}">
        ${ci.map(it => renderTinyItem(it)).join('')}
      </div>
    </div>`;
  });

  html += `<button class="add-pouch-btn" data-section="${esc(section)}" onclick="APP.addCategory('${esc(section)}')">＋ 주머니 추가</button>
    </div>`;

  if (!collapsed) {
    html += `<div class="col-floor">
      <div class="col-title">
        <span>🪣 바닥 (${floorItems.length})</span>
      </div>
      <div class="floor cat-items" data-cat="${FLOOR_CAT}" data-section="${esc(section)}">
        ${floorItems.map(it => renderTinyItem(it)).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  return html;
}

function renderTinyItem(item) {
  return `<div class="itm tiny" data-id="${item.id}">
    <span class="itm-label">${esc(item.label)}</span>
    <button class="btn-rename" onclick="event.stopPropagation();APP.renameItem('${item.id}')" title="이름 수정">✎</button>
  </div>`;
}

function renderPackItem(item, nights) {
  const isLocal = item.localBuy;
  const isDone  = item.checked;

  // qty badge (perDay 우선 → qtyF)
  let qtyHtml = '';
  const q = itemQty(item, nights);
  if (q != null) {
    if (item.perDayEvery && item.perDayCount) {
      const lbl = item.perDayEvery === 1 ? `하루 ${item.perDayCount}개` : `${item.perDayEvery}일에 ${item.perDayCount}개`;
      qtyHtml = `<span class="itm-qty">${lbl} → ×${q}</span>`;
    } else {
      qtyHtml = `<span class="itm-qty">${nights}박 기준 ×${q}</span>`;
    }
  }

  // 정기 설정 칩 — 설정값 표시, 탭 시 인라인 픽커
  let periodChip = '';
  if (item.perDayEvery && item.perDayCount) {
    const lbl = item.perDayEvery === 1
      ? `하루 ${item.perDayCount}개`
      : `${item.perDayEvery}일에 ${item.perDayCount}개`;
    periodChip = `<span class="itm-period" onclick="event.preventDefault();event.stopPropagation();APP.openPeriodPicker('${item.id}', this)">🔁 ${lbl}</span>`;
  } else {
    periodChip = `<span class="itm-period empty" onclick="event.preventDefault();event.stopPropagation();APP.openPeriodPicker('${item.id}', this)">🔁 정기?</span>`;
  }

  // 소분 토글 칩 — 클릭 한 번으로 켜고 끔. 켜면 패널 자동 펼침.
  let decantChip = '';
  if (item.hasMl) {
    let info = '소분';
    if (item.pumpsPerDay && item.mlPerPump) info = `${(item.pumpsPerDay*item.mlPerPump).toFixed(1)}ml/일`;
    else if (item.ml) info = `${item.ml}ml`;
    decantChip = `<span class="itm-decant" onclick="event.preventDefault();event.stopPropagation();APP.toggleHasMl('${item.id}')" title="탭하여 소분 끄기">💧 ${info}</span>`;
  } else {
    decantChip = `<span class="itm-decant empty" onclick="event.preventDefault();event.stopPropagation();APP.toggleHasMl('${item.id}')" title="탭하여 소분 켜기">💧 소분?</span>`;
  }

  // tag
  let tagHtml = '';
  if (item.ti) tagHtml += `<span class="tag tag-${item.ti}">${esc(item.tt||'')}</span>`;
  if (isLocal)  tagHtml += `<span class="tag tag-local">🛒 현지구매</span>`;

  // decant
  let decantBtn = '', decantPanel = '';
  if (item.hasMl) {
    const pumpMl = calcPumpMl(item.pumpsPerDay, item.mlPerPump, nights);
    const effectiveMl = item.ml || pumpMl;
    const hasVal = effectiveMl && effectiveMl > 0;
    const needed = hasVal ? calcDecant(effectiveMl, item.cml||50) : null;
    decantBtn = `<button class="btn-decant${hasVal?' has-val':''}" onclick="APP.toggleDecant('${item.id}')">소분</button>`;
    const hasPump = item.pumpsPerDay && item.mlPerPump;
    const mlp = item.mlPerPump || 0;
    const sizeChip = (val, label) =>
      `<button type="button" class="pump-chip${Math.abs(mlp-val)<0.01?' on':''}" onclick="APP.setPumpSize('${item.id}',${val})">${label}</button>`;
    const pumpRow = `
        <div class="dp-divider"></div>
        <div class="dp-section-label">펌프 기반 자동 계산${hasPump?'':' (선택)'}</div>
        <div class="pump-chips">
          ${sizeChip(0.6,'소 0.6ml')}
          ${sizeChip(1.25,'중 1~1.5ml')}
          ${sizeChip(2.5,'대 2~3ml')}
        </div>
        <div class="dp-group">
          <label>하루 펌프</label>
          <input type="number" id="ppd-${item.id}" min="0" step="0.5" value="${item.pumpsPerDay||''}"
            onchange="APP.savePumpField('${item.id}')">
        </div>
        <div class="dp-group">
          <label>1펌프 ml</label>
          <input type="number" id="mlp-${item.id}" min="0" step="0.05" value="${item.mlPerPump||''}"
            onchange="APP.savePumpField('${item.id}')">
        </div>
        ${hasPump ? `<div class="dp-result calc">≈ ${pumpMl} ml 필요 (${nights+1}일)</div>` : ''}
        ${(hasPump && !item.ml) ? `<button class="dp-apply" onclick="APP.applyPumpMl('${item.id}')">필요량 적용</button>` : ''}
      `;
    decantPanel = `
      <div class="decant-panel" id="dp-${item.id}">
        <div class="dp-group">
          <label>원본 용량 (ml)</label>
          <input type="number" min="0" max="9999" placeholder="예: 150"
            value="${item.ml||''}"
            onchange="APP.saveDecant('${item.id}',this.value,document.getElementById('dc-${item.id}').value)">
        </div>
        <div class="dp-group">
          <label>용기 사이즈</label>
          <select id="dc-${item.id}"
            onchange="APP.saveDecant('${item.id}',this.parentElement.previousElementSibling.querySelector('input').value,this.value)">
            <option value="30" ${(item.cml||50)==30?'selected':''}>30ml</option>
            <option value="50" ${(item.cml||50)==50?'selected':''}>50ml</option>
            <option value="100" ${(item.cml||50)==100?'selected':''}>100ml</option>
          </select>
        </div>
        ${needed ? `<div class="dp-result" id="dpr-${item.id}">용기 ${needed}개 필요</div>` : `<div class="dp-result" id="dpr-${item.id}" style="display:none"></div>`}
        ${pumpRow}
      </div>`;
  }

  return `
    <div class="itm ${isDone&&!isLocal?'done':''} ${isLocal?'is-local':''}" id="itm-${item.id}" data-id="${item.id}">
      <div class="itm-row">
        <span class="drag-handle" title="이동">⋮⋮</span>
        <input type="checkbox" class="itm-cb" id="cb-${item.id}"
          ${isDone?'checked':''} ${isLocal?'disabled':''}
          onchange="APP.toggleCheck('${item.id}',this.checked)">
        <div class="itm-main">
          <label class="itm-label" for="cb-${item.id}">${esc(item.label)}</label>
          ${qtyHtml}${tagHtml}${periodChip}${decantChip}
        </div>
        ${decantBtn}
        <button class="btn-local${isLocal?' on':''}" onclick="APP.toggleLocal('${item.id}')" title="현지구매 전환">🛒</button>
        <button class="btn-itm-edit" onclick="APP.editItem('${item.id}')">수정</button>
        <button class="btn-itm-del" onclick="APP.deleteItem('${item.id}')">삭제</button>
      </div>
      ${decantPanel}
    </div>`;
}

function renderSimpleItem(item) {
  let periodChip = '';
  if (item.perDayEvery && item.perDayCount) {
    const lbl = item.perDayEvery === 1
      ? `하루 ${item.perDayCount}개`
      : `${item.perDayEvery}일에 ${item.perDayCount}개`;
    periodChip = `<span class="itm-period" onclick="APP.editItem('${item.id}')">🔁 ${lbl}</span>`;
  } else {
    periodChip = `<span class="itm-period empty" onclick="APP.editItem('${item.id}')">🔁 정기?</span>`;
  }
  return `
    <div class="itm ${item.checked?'done':''}" id="itm-${item.id}" data-id="${item.id}">
      <div class="itm-row">
        <span class="drag-handle" title="이동">⋮⋮</span>
        <input type="checkbox" class="itm-cb" id="cb-${item.id}"
          ${item.checked?'checked':''}
          onchange="APP.toggleCheck('${item.id}',this.checked)">
        <div class="itm-main">
          <label class="itm-label" for="cb-${item.id}">${esc(item.label)}</label>
          ${item.ti?`<span class="tag tag-${item.ti}">${esc(item.tt||'')}</span>`:''}
          ${periodChip}
        </div>
        <button class="btn-itm-edit" onclick="APP.editItem('${item.id}')">수정</button>
        <button class="btn-itm-del" onclick="APP.deleteItem('${item.id}')">삭제</button>
      </div>
    </div>`;
}

function renderSimple(items, meta, section) {
  const si = items.filter(i => i.section === section);
  let html = renderEditHint();
  if (!si.length && !editMode) {
    html += `<div style="padding:2rem;text-align:center;color:var(--text-muted)">항목이 없어요</div>`;
    return html;
  }
  const cats = getCatOrder(items, section, meta);
  html += `<div id="cat-list" data-section="${esc(section)}">`;
  cats.forEach(cat => {
    html += renderCategory(si, cat, 0, section);
  });
  html += `</div>`;
  html += `<button class="add-cat-btn" data-section="${esc(section)}">＋ 새 카테고리</button>`;
  return html;
}

function renderLocal(items, meta) {
  const fromPack  = items.filter(i => i.section==='pack' && i.localBuy);
  const localOnly = items.filter(i => i.section==='local');

  let html = `<div class="notice notice-info">현지에서 구매 예정인 항목이에요. 따로 챙기지 않아도 돼요.</div>`;
  html += renderEditHint();

  if (fromPack.length && !editMode) {
    html += `<div class="sec"><div class="sec-title">짐 목록에서 이동됨</div>`;
    fromPack.forEach(item => {
      html += `<div class="local-row">
        <span>🛒</span>
        <span class="local-label">${esc(item.label)}</span>
        <button class="revert-btn" onclick="APP.toggleLocal('${item.id}')">되돌리기</button>
      </div>`;
    });
    html += `</div>`;
  }

  // 편집 모드: local 섹션 항목들도 카테고리/드래그 가능
  const cats = getCatOrder(items, 'local', meta);
  if (cats.length || editMode) {
    if (!editMode) html += `<div class="sec"><div class="sec-title">기본 현지 구매 목록</div>`;
    if (editMode) {
      html += `<div id="cat-list" data-section="local">`;
      cats.forEach(cat => { html += renderCategory(localOnly, cat, 0, 'local'); });
      html += `</div>`;
      html += `<button class="add-cat-btn" data-section="local">＋ 새 카테고리</button>`;
    } else {
      localOnly.forEach(item => {
        html += `<div class="local-row">
          <span style="color:var(--text-muted)">·</span>
          <span class="local-label">${esc(item.label)}</span>
          ${item.ti?`<span class="tag tag-${item.ti}">${esc(item.tt||'')}</span>`:''}
        </div>`;
      });
      html += `</div>`;
    }
  }

  if (!fromPack.length && !localOnly.length && !editMode) {
    html += `<div style="padding:2rem;text-align:center;color:var(--text-muted)">항목이 없어요</div>`;
  }
  return html;
}

// ── SORTABLE INIT ──────────────────────
function initSortables() {
  if (!window.Sortable) return;
  const isCategorize = editMode === 'categorize';
  const opts = {
    animation: 150,
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    forceFallback: true,
    fallbackTolerance: 4,
    delay: isCategorize ? 140 : 80,
    delayOnTouchOnly: true,
    onEnd: onItemSortEnd
  };
  // 분류 모드: 항목 전체가 드래그 대상, 수정 버튼은 제외. 그 외엔 핸들만.
  if (isCategorize) {
    opts.filter = '.btn-rename';
    opts.preventOnFilter = true;
  } else {
    opts.handle = '.drag-handle';
  }

  // 항목 드래그: 같은 섹션 내 카테고리들 끼리 group
  document.querySelectorAll('.cat-items').forEach(el => {
    const section = el.dataset.section;
    _sortables.push(new Sortable(el, {
      ...opts,
      group: 'items-' + section
    }));
  });

  // 카테고리 드래그 — 분류 모드에선 비활성 (카테고리 위치 잠금)
  if (editMode === 'edit') {
    const catList = document.getElementById('cat-list');
    if (catList) {
      _sortables.push(new Sortable(catList, {
        animation: 150,
        handle: '.cat-handle',
        ghostClass: 'sortable-ghost',
        forceFallback: true,
        fallbackTolerance: 4,
        delay: 80,
        delayOnTouchOnly: true,
        onEnd: onCatSortEnd
      }));
    }
  }
}

async function onItemSortEnd(evt) {
  const fromCat = evt.from.dataset.cat;
  const toCat   = evt.to.dataset.cat;
  const section = evt.to.dataset.section;
  if (!tripId) return;

  const updates = {};

  // 이동된 항목의 카테고리 변경
  const movedId = evt.item.dataset.id;
  if (movedId && fromCat !== toCat) {
    updates[`${DB_ROOT}/${tripId}/items/${movedId}/cat`] = toCat;
  }

  // 변경된 두 카테고리의 모든 항목 ord를 다시 계산
  const affectedCats = new Set([fromCat, toCat]);
  affectedCats.forEach(cat => {
    const container = document.querySelector(`.cat-items[data-cat="${CSS.escape(cat)}"][data-section="${CSS.escape(section)}"]`);
    if (!container) return;
    [...container.querySelectorAll('.itm[data-id]')].forEach((node, idx) => {
      const id = node.dataset.id;
      updates[`${DB_ROOT}/${tripId}/items/${id}/ord`] = idx;
    });
  });

  if (Object.keys(updates).length) {
    showSync();
    await update(ref(db, '/'), updates);
  }
}

async function onCatSortEnd(evt) {
  const section = evt.to.dataset.section;
  if (!tripId) return;
  const order = [...document.querySelectorAll(`#cat-list[data-section="${CSS.escape(section)}"] .sec[data-cat]`)]
    .map(s => s.dataset.cat);
  const meta = db_data[tripId]?.meta || {};
  const catOrder = { ...(meta.catOrder || {}) };
  catOrder[section] = order;
  await dbUpd(`${DB_ROOT}/${tripId}/meta`, { catOrder });
}

// ── GLOBAL ACTIONS ─────────────────────
const APP = {
  openTrip(id) {
    tripId = id;
    curTab = 'pack';
    editMode = null;
    const m = db_data[id]?.meta || {};
    document.getElementById('hd-name').textContent    = m.name  || '';
    document.getElementById('hd-nights').textContent  = m.nights ? nightsLabel(m.nights) : '';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab==='pack'));
    showScreen('s-trip');
    renderChecklist();
  },

  toggleEditMode() {
    editMode = editMode === 'edit' ? null : 'edit';
    renderChecklist();
  },

  toggleCategorizeMode() {
    if (editMode === 'categorize') { editMode = null; _expandedPouches.clear(); }
    else editMode = 'categorize';
    renderChecklist();
  },

  togglePouch(headerEl) {
    const pouch = headerEl.closest('.pouch');
    if (!pouch) return;
    const cat = pouch.dataset.cat;
    if (pouch.classList.contains('expanded')) {
      pouch.classList.remove('expanded');
      pouch.classList.add('collapsed');
      _expandedPouches.delete(curTab + ':' + cat);
    } else {
      pouch.classList.remove('collapsed');
      pouch.classList.add('expanded');
      _expandedPouches.add(curTab + ':' + cat);
    }
  },

  toggleFloor() {
    _floorCollapsed = !_floorCollapsed;
    renderChecklist();
  },

  toggleAllPouches() {
    const allItems = Object.values(db_data[tripId]?.items || {});
    const cats = getCatOrder(allItems, curTab, db_data[tripId]?.meta).filter(c => c !== FLOOR_CAT);
    const allExpanded = cats.length > 0 && cats.every(c => _expandedPouches.has(curTab + ':' + c));
    if (allExpanded) {
      cats.forEach(c => _expandedPouches.delete(curTab + ':' + c));
    } else {
      cats.forEach(c => _expandedPouches.add(curTab + ':' + c));
    }
    renderChecklist();
  },

  openPeriodPicker(itemId, anchor) {
    document.querySelectorAll('.period-picker').forEach(p => {
      if (p._closeFn) document.removeEventListener('click', p._closeFn);
      p.remove();
    });
    const item = db_data[tripId]?.items?.[itemId];
    if (!item) return;
    const isSet = item.perDayEvery && item.perDayCount;
    const presets = [
      {e:1, c:1, l:'매일 1개'},
      {e:2, c:1, l:'2일에 1개'},
      {e:3, c:1, l:'3일에 1개'},
      {e:4, c:1, l:'4일에 1개'},
      {e:1, c:2, l:'매일 2개'}
    ];
    const isCurrent = (e,c) => isSet && +item.perDayEvery===e && +item.perDayCount===c;
    let html = presets.map(p =>
      `<button class="${isCurrent(p.e,p.c)?'on':''}" onclick="APP.setPeriod('${itemId}',${p.e},${p.c})">${p.l}</button>`
    ).join('');
    if (isSet) html += `<button class="off" onclick="APP.setPeriod('${itemId}',null,null)">해제</button>`;
    html += `<button class="more" onclick="APP._closePeriodPicker();APP.editItem('${itemId}')">직접…</button>`;

    const picker = document.createElement('div');
    picker.className = 'period-picker';
    picker.innerHTML = html;
    document.body.appendChild(picker);

    const r = anchor.getBoundingClientRect();
    const pw = picker.offsetWidth;
    picker.style.top  = (r.bottom + window.scrollY + 4) + 'px';
    picker.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.innerWidth - pw - 8)) + 'px';

    setTimeout(() => {
      const close = e => {
        if (!picker.contains(e.target) && !anchor.contains(e.target)) {
          APP._closePeriodPicker();
        }
      };
      document.addEventListener('click', close);
      picker._closeFn = close;
    }, 0);
  },

  _closePeriodPicker() {
    document.querySelectorAll('.period-picker').forEach(p => {
      if (p._closeFn) document.removeEventListener('click', p._closeFn);
      p.remove();
    });
  },

  async setPeriod(itemId, every, count) {
    APP._closePeriodPicker();
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, {
      perDayEvery: every, perDayCount: count
    });
  },

  async renameItem(itemId) {
    const item = db_data[tripId]?.items?.[itemId];
    if (!item) return;
    const newName = prompt('항목 이름', item.label);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed || trimmed === item.label) return;
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { label: trimmed });
  },

  async resetToFloor() {
    if (!confirm(`"${curTab}" 탭의 모든 항목을 바닥으로 빼고 처음부터 분류할까요?\n(이름·옵션은 그대로 유지됩니다)`)) return;
    const items = db_data[tripId]?.items || {};
    const updates = {};
    Object.entries(items).forEach(([iid, it]) => {
      if (it.section === curTab && (it.cat||'') !== FLOOR_CAT) {
        updates[`${DB_ROOT}/${tripId}/items/${iid}/cat`] = FLOOR_CAT;
      }
    });
    if (Object.keys(updates).length) {
      showSync();
      await update(ref(db, '/'), updates);
    }
  },

  exitEditMode() {
    editMode = null;
    _expandedPouches.clear();
    renderChecklist();
  },

  async toggleCheck(itemId, checked) {
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { checked });
  },

  async toggleLocal(itemId) {
    const item = db_data[tripId]?.items?.[itemId];
    if (!item) return;
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { localBuy: !item.localBuy, checked: false });
  },

  toggleDecant(itemId) {
    const el = document.getElementById('dp-'+itemId);
    if (!el) return;
    el.classList.toggle('open');
    if (el.classList.contains('open')) _openDecants.add(itemId);
    else _openDecants.delete(itemId);
  },

  async toggleHasMl(itemId) {
    const item = db_data[tripId]?.items?.[itemId];
    if (!item) return;
    const newVal = !item.hasMl;
    if (newVal) _openDecants.add(itemId);
    else _openDecants.delete(itemId);
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { hasMl: newVal });
  },

  async saveDecant(itemId, mlVal, cmlVal) {
    const ml  = parseFloat(mlVal) || null;
    const cml = parseInt(cmlVal) || 50;
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { ml, cml });
    const item   = { ...(db_data[tripId]?.items?.[itemId]||{}), ml, cml };
    const nights = db_data[tripId]?.meta?.nights || 0;
    const pumpMl = calcPumpMl(item.pumpsPerDay, item.mlPerPump, nights);
    const eff    = ml || pumpMl;
    const needed = eff ? calcDecant(eff, cml) : null;
    const resEl  = document.getElementById('dpr-'+itemId);
    if (resEl) {
      resEl.textContent   = needed ? `용기 ${needed}개 필요` : '';
      resEl.style.display = needed ? '' : 'none';
    }
    const btn = document.querySelector(`#itm-${itemId} .btn-decant`);
    if (btn) btn.classList.toggle('has-val', !!eff);
  },

  async savePump(itemId, ppdVal, mlpVal) {
    const pumpsPerDay = parseFloat(ppdVal) || null;
    const mlPerPump   = parseFloat(mlpVal) || null;
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { pumpsPerDay, mlPerPump });
  },

  async savePumpField(itemId) {
    const ppd = document.getElementById('ppd-'+itemId)?.value;
    const mlp = document.getElementById('mlp-'+itemId)?.value;
    return APP.savePump(itemId, ppd, mlp);
  },

  async setPumpSize(itemId, mlp) {
    const inp = document.getElementById('mlp-'+itemId);
    if (inp) inp.value = mlp;
    const ppd = document.getElementById('ppd-'+itemId)?.value;
    await APP.savePump(itemId, ppd, mlp);
    renderChecklist();
  },

  async applyPumpMl(itemId) {
    const item   = db_data[tripId]?.items?.[itemId];
    const nights = db_data[tripId]?.meta?.nights || 0;
    if (!item) return;
    const ml = calcPumpMl(item.pumpsPerDay, item.mlPerPump, nights);
    if (!ml) return;
    await dbUpd(`${DB_ROOT}/${tripId}/items/${itemId}`, { ml });
  },

  editItem(itemId) {
    openItemModal(itemId);
  },

  async deleteItem(itemId) {
    const item = db_data[tripId]?.items?.[itemId];
    if (!item) return;
    if (!confirm(`"${item.label}" 항목을 삭제할까요?`)) return;
    await dbDel(`${DB_ROOT}/${tripId}/items/${itemId}`);
  },

  async addCategory(section) {
    const name = prompt('새 카테고리 이름');
    if (!name) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    const meta = db_data[tripId]?.meta || {};
    const catOrder = { ...(meta.catOrder || {}) };
    const cur = catOrder[section] || [];
    if (cur.includes(trimmed)) { alert('이미 같은 이름의 카테고리가 있어요'); return; }
    catOrder[section] = [...cur, trimmed];
    await dbUpd(`${DB_ROOT}/${tripId}/meta`, { catOrder });
  },

  async renameCategory(section, oldName) {
    const newName = prompt('카테고리 이름 변경', oldName);
    if (!newName) return;
    const trimmed = newName.trim();
    if (!trimmed || trimmed === oldName) return;
    const items = db_data[tripId]?.items || {};
    const updates = {};
    Object.entries(items).forEach(([iid, it]) => {
      if (it.section === section && (it.cat||'기타') === oldName) {
        updates[`${DB_ROOT}/${tripId}/items/${iid}/cat`] = trimmed;
      }
    });
    const meta = db_data[tripId]?.meta || {};
    const catOrder = { ...(meta.catOrder || {}) };
    const cur = catOrder[section] || [];
    if (cur.length) catOrder[section] = cur.map(c => c === oldName ? trimmed : c);
    updates[`${DB_ROOT}/${tripId}/meta/catOrder`] = catOrder;
    showSync();
    await update(ref(db, '/'), updates);
  },

  async deleteCategory(section, cat) {
    const items = db_data[tripId]?.items || {};
    const inCat = Object.entries(items).filter(([_,it]) => it.section === section && (it.cat||'기타') === cat);
    if (inCat.length) {
      if (!confirm(`"${cat}" 카테고리의 항목 ${inCat.length}개도 같이 삭제할까요?`)) return;
    } else {
      if (!confirm(`"${cat}" 카테고리를 삭제할까요?`)) return;
    }
    const updates = {};
    inCat.forEach(([iid]) => { updates[`${DB_ROOT}/${tripId}/items/${iid}`] = null; });
    const meta = db_data[tripId]?.meta || {};
    const catOrder = { ...(meta.catOrder || {}) };
    const cur = catOrder[section] || [];
    catOrder[section] = cur.filter(c => c !== cat);
    updates[`${DB_ROOT}/${tripId}/meta/catOrder`] = catOrder;
    showSync();
    await update(ref(db, '/'), updates);
  }
};
window.APP = APP;

function openTripModal(id = null) {

  document.getElementById('m-trip-title').textContent = isEdit ? '여행 수정' : '새 여행';

  document.getElementById('inp-name').value  = m.name  || '';
  document.getElementById('inp-dest').value  = m.dest  || '';
  document.getElementById('inp-start').value = m.start || '';
  document.getElementById('inp-end').value   = m.end   || '';
  updateNightsChip();
  document.getElementById('m-trip').style.display = 'flex';
}

function closeTripModal() {
  document.getElementById('m-trip').style.display = 'none';
  editId = null;
}

function updateNightsChip() {
  const s = document.getElementById('inp-start').value;
  const e = document.getElementById('inp-end').value;
  const n = calcNights(s, e);
  const chip = document.getElementById('nights-chip');
  if (s && e) {
    chip.textContent = nightsLabel(n);
    chip.style.display = 'block';
  } else {
    chip.style.display = 'none';
  }
}

async function saveTripHandler() {
  const name  = document.getElementById('inp-name').value.trim();
  const dest  = document.getElementById('inp-dest').value.trim();
  const start = document.getElementById('inp-start').value;
  const end   = document.getElementById('inp-end').value;
  if (!name) { alert('여행 이름을 입력해주세요'); return; }
  const nights = calcNights(start, end);

  if (editId) {
    // Edit — recalculate auto qtys
    const meta = { ...db_data[editId]?.meta, name, dest, start, end, nights };
    await dbSet(`${DB_ROOT}/${editId}/meta`, meta);
    const items = db_data[editId]?.items || {};
    const upd = {};
    Object.entries(items).forEach(([iid, item]) => {
      if (item.qtyF && nights > 0) upd[`${DB_ROOT}/${editId}/items/${iid}/qty`] = calcQty(item.qtyF, nights);
    });
    if (Object.keys(upd).length) { showSync(); await update(ref(db, '/'), upd); }
    closeTripModal();
  } else {
    // Create
    const id   = 'trip_' + Date.now();
    const meta = { name, dest, start, end, nights, ca: Date.now() };
    const items = makeTemplate(nights);
    await dbSet(`${DB_ROOT}/${id}`, { meta, items });
    closeTripModal();
    APP.openTrip(id);
  }
}

async function deleteTripHandler() {
  if (!editId) return;
  if (!confirm(`"${db_data[editId]?.meta?.name}" 여행을 삭제할까요?`)) return;
  await dbDel(`${DB_ROOT}/${editId}`);
  delete db_data[editId];
  closeTripModal();
  tripId = null;
  showScreen('s-home');
  renderHome();
}

  document.getElementById('inp-icat').value   = item.cat   || '';
  document.getElementById('inp-itab').value   = item.section || (curTab==='local'?'local':curTab==='todo'?'todo':curTab==='recommend'?'recommend':'pack');

  // 카테고리 자동완성 채우기
  const dl = document.getElementById('cat-suggest');

  Object.values(db_data[tripId]?.items||{}).forEach(i => { if (i.cat) cats.add(i.cat); });

  document.getElementById('inp-ipump-pd').value  = item.pumpsPerDay || '';
  document.getElementById('inp-ipump-mlp').value = item.mlPerPump   || '';

function closeItemModal() {
  document.getElementById('m-item').style.display = 'none';
  editItemId = null;
}

function updatePdPreview() {
  const on    = document.getElementById('inp-ipd-on').checked;
  const every = parseInt(document.getElementById('inp-ipd-every').value) || 0;
  const count = parseInt(document.getElementById('inp-ipd-count').value) || 0;
  const nights= db_data[tripId]?.meta?.nights || 0;
  const el    = document.getElementById('inp-ipd-preview');
  if (on && every > 0 && count > 0) {
    const q = calcQtyPeriodic(every, count, nights);
    el.textContent = nights > 0 ? `${nights}박 ${nights+1}일 → 총 ${q}개 필요` : `1일 기준 ${count}개 (출발일 미정)`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function updatePumpPreview() {
  const on  = document.getElementById('inp-iml').checked;
  const ppd = parseFloat(document.getElementById('inp-ipump-pd').value) || 0;
  const mlp = parseFloat(document.getElementById('inp-ipump-mlp').value) || 0;
  const nights = db_data[tripId]?.meta?.nights || 0;
  const el  = document.getElementById('inp-ipump-preview');
  if (on && ppd > 0 && mlp > 0) {
    const days   = Math.max(1, nights + 1);
    const totalP = +(ppd * days).toFixed(1);
    const totalM = +(ppd * mlp * days).toFixed(2);
    el.textContent = `${days}일 × ${ppd}펌프 = 총 ${totalP}펌프 = ${totalM}ml`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

  closeItemModal();
}

// ── EVENTS ─────────────────────────────
document.getElementById('btn-new').onclick       = () => openTripModal(null);
document.getElementById('btn-edit').onclick      = () => openTripModal(tripId);
document.getElementById('btn-edit-mode').onclick = () => APP.toggleEditMode();
document.getElementById('btn-categorize').onclick= () => APP.toggleCategorizeMode();
document.getElementById('btn-save-edit').onclick = () => APP.exitEditMode();
document.getElementById('btn-back').onclick      = () => { tripId=null; editMode=null; destroySortables(); showScreen('s-home'); renderHome(); };
document.getElementById('btn-save-trip').onclick = saveTripHandler;
document.getElementById('btn-del-trip').onclick  = deleteTripHandler;
document.getElementById('m-trip-close').onclick  = closeTripModal;
document.getElementById('btn-add-item').onclick  = () => openItemModal(null);
document.getElementById('btn-save-item').onclick = saveItemHandler;
document.getElementById('btn-del-item').onclick  = deleteItemFromModal;
document.getElementById('m-item-close').onclick  = closeItemModal;
document.getElementById('inp-start').addEventListener('change', updateNightsChip);
document.getElementById('inp-end').addEventListener('change', updateNightsChip);

// 모달 내 정기/펌프 옵션 토글 + 미리보기
document.getElementById('inp-ipd-on').addEventListener('change', e => {
  document.getElementById('inp-ipd-box').style.display = e.target.checked ? 'flex' : 'none';
  updatePdPreview();
});
document.getElementById('inp-ipd-every').addEventListener('input', updatePdPreview);
document.getElementById('inp-ipd-count').addEventListener('input', updatePdPreview);
document.getElementById('inp-iml').addEventListener('change', e => {
  document.getElementById('inp-ipump-box').style.display = e.target.checked ? 'flex' : 'none';
  updatePumpPreview();
});
document.getElementById('inp-ipump-pd').addEventListener('input', updatePumpPreview);
document.getElementById('inp-ipump-mlp').addEventListener('input', () => { updatePumpPreview(); refreshPumpChipState(); });

// 정기 사용량 프리셋 칩
document.getElementById('pd-presets').addEventListener('click', e => {
  const chip = e.target.closest('.pump-chip');
  if (!chip) return;
  document.getElementById('inp-ipd-on').checked = true;
  document.getElementById('inp-ipd-box').style.display = 'flex';
  document.getElementById('inp-ipd-every').value = chip.dataset.every;
  document.getElementById('inp-ipd-count').value = chip.dataset.count;
  refreshPdChipState();
  updatePdPreview();
});

// 펌프 사이즈 프리셋 칩 (모달)
document.getElementById('pump-size-presets').addEventListener('click', e => {
  const chip = e.target.closest('.pump-chip');
  if (!chip) return;
  document.getElementById('inp-iml').checked = true;
  document.getElementById('inp-ipump-box').style.display = 'flex';
  document.getElementById('inp-ipump-mlp').value = chip.dataset.mlp;
  refreshPumpChipState();
  updatePumpPreview();
});

function refreshPdChipState() {
  const e = parseInt(document.getElementById('inp-ipd-every').value) || 0;
  const c = parseInt(document.getElementById('inp-ipd-count').value) || 0;
  document.querySelectorAll('#pd-presets .pump-chip').forEach(ch => {
    ch.classList.toggle('on', +ch.dataset.every===e && +ch.dataset.count===c);
  });
}
function refreshPumpChipState() {
  const v = parseFloat(document.getElementById('inp-ipump-mlp').value) || 0;
  document.querySelectorAll('#pump-size-presets .pump-chip').forEach(ch => {
    ch.classList.toggle('on', Math.abs(+ch.dataset.mlp - v) < 0.01);
  });
}
document.getElementById('inp-ipd-every').addEventListener('input', refreshPdChipState);
document.getElementById('inp-ipd-count').addEventListener('input', refreshPdChipState);

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = function() {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    this.classList.add('on');
    curTab = this.dataset.tab;
    renderChecklist();
  };
});

// 동적으로 생성된 "+ 새 카테고리" 버튼 처리
document.getElementById('cl-content').addEventListener('click', e => {
  const btn = e.target.closest('.add-cat-btn');
  if (btn) APP.addCategory(btn.dataset.section);
});

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.onclick = e => { if (e.target === o) o.style.display = 'none'; };
});

// ── PWA MANIFEST ───────────────────────
// 안드로이드 WebAPK는 PNG 아이콘일 때 가장 안정적이고 크롬 배지 없는
// 진짜 앱으로 설치됨. SVG는 보조로 추가, 콘텐츠가 중앙 80% 안전
// 영역 안에 있어 maskable 크롭에도 잘리지 않음.
const ICON_PNG_192 = '/JIMSSAGI/icon-192.png';
const ICON_PNG_512 = '/JIMSSAGI/icon-512.png';
const ICON_SVG     = '/JIMSSAGI/icon.svg';

const mani = JSON.stringify({
  name:'짐싸기', short_name:'짐싸기',
  start_url:'/JIMSSAGI/',
  scope:'/JIMSSAGI/',
  display:'standalone',
  background_color:'#6b5ce7', theme_color:'#6b5ce7',
  icons:[
    {src:ICON_PNG_192, sizes:'192x192', type:'image/png', purpose:'any maskable'},
    {src:ICON_PNG_512, sizes:'512x512', type:'image/png', purpose:'any maskable'},
    {src:ICON_SVG,     sizes:'any',     type:'image/svg+xml', purpose:'any maskable'}
  ]
});
const mLink = document.createElement('link');
mLink.rel = 'manifest';
mLink.href = URL.createObjectURL(new Blob([mani], {type:'application/json'}));
document.head.appendChild(mLink);

// iOS 홈 화면 아이콘
const apl = document.createElement('link');
apl.rel = 'apple-touch-icon';
apl.href = ICON_PNG_192;
document.head.appendChild(apl);

// ── SERVICE WORKER (PWA installability) ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('SW register failed:', err);
    });
  });
}

// ── FIREBASE LISTENER + INIT ────────────
onValue(ref(db, DB_ROOT), snap => {
  db_data = snap.exists() ? snap.val() : {};
  renderHome();
  if (tripId && db_data[tripId]) {
    const m = db_data[tripId].meta || {};
    document.getElementById('hd-name').textContent   = m.name   || '';
    document.getElementById('hd-nights').textContent = m.nights ? nightsLabel(m.nights) : '';
    renderChecklist();
  }
}, err => console.error('Firebase error:', err));
</script>
